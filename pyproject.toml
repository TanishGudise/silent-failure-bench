[project]
name = "silent-failure-bench"
version = "0.1.0"
description = "Exactly labeled silent failures in tool-using agent traces, and whether fixes for them hold up"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.1.0",
    "uselemma-tracing==7.12.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
